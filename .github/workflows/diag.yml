name: diag
on:
  push:
    branches: [main]
    paths: ['banco/diag.txt']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: nproc; free -g
      - run: |
          python3 - <<'PY'
          import requests,time,re
          import json
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/124","Accept":"application/json"}
          r=requests.get("https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1984-07-11;7210&tipo_documento=maior-detalhe",headers=H,timeout=60)
          print("DIAG NORMAS",re.sub(r"\s+"," ",r.text)[:4700])
          r=requests.get("https://legis.senado.leg.br/dadosabertos/legislacao/urn?urn=urn:lex:br:federal:lei:1984-07-11;7210",headers=H,timeout=90)
          d=r.json()
          def anda(o,c=""):
              if isinstance(o,dict):
                  for k,v in o.items(): anda(v,c+"/"+k)
              elif isinstance(o,list):
                  print("DIAG LISTA",c,len(o)); anda(o[0] if o else None,c+"[0]")
              elif isinstance(o,str) and ("http" in o or len(o)>200): print("DIAG CAMPO",c,o[:160])
          anda(d)
          PY
