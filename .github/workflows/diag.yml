name: diag
on:
  push:
    branches: [main]
    paths: ['banco/diag.txt']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: nproc; free -g
      - run: |
          python3 - <<'PY'
          import requests,time,re
          U=["https://www.planalto.gov.br/ccivil_03/leis/l7210.htm","http://www.planalto.gov.br/ccivil_03/leis/l7210.htm","https://planalto.gov.br/ccivil_03/leis/l7210.htm",
             "https://www2.camara.leg.br/legin/fed/lei/1984/lei-7210-11-julho-1984-356938-normaatualizada-pl.html",
             "https://www.lexml.gov.br/urn/urn:lex:br:federal:lei:1984-07-11;7210",
             "https://legis.senado.leg.br/norma/549734/publicacao/15681086"]
          r=requests.get(U[0],timeout=60,headers={"User-Agent":"Mozilla/5.0"}); h=r.content
          import codecs
          for enc in ("latin-1",):
              t=h.decode(enc,"replace"); i=t.find("Art"); print("DIAG ENC",r.headers.get("content-type"),r.apparent_encoding)
              for m in list(re.finditer(r"Art",t))[:4]: print("DIAG TRECHO",repr(t[m.start()-60:m.start()+80]))
          for u in U[3:]:
              t=time.time()
              try:
                  r=requests.get(u,timeout=60,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36","Accept-Language":"pt-BR"})
                  r.encoding=r.apparent_encoding
                  print("DIAG",r.status_code,round(time.time()-t,1),"s",len(r.text),"chars",len(re.findall(r"Art\.\s*\d",r.text)),"artigos",u)
              except Exception as e: print("DIAG ERRO",type(e).__name__,str(e)[:120],round(time.time()-t,1),"s",u)
          PY
