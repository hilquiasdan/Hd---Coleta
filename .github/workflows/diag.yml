name: diag
on:
  push:
    branches: [main]
    paths: ['banco/diag.txt']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: nproc; free -g
      - run: |
          python3 - <<'PY'
          import requests,time,re
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/124","Accept":"application/json, text/html"}
          U=["https://normas.leg.br/api/normas?urn=urn:lex:br:federal:lei:1984-07-11;7210&tipo_documento=maior-detalhe",
             "https://normas.leg.br/api/normas?urn=urn:lex:br:federal:lei:1984-07-11;7210",
             "https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1984-07-11;7210&tipo_documento=maior-detalhe",
             "https://legis.senado.leg.br/dadosabertos/legislacao/urn?urn=urn:lex:br:federal:lei:1984-07-11;7210",
             "https://www2.camara.leg.br/legin/fed/lei/1984/lei-7210-11-julho-1984-356938-publicacaooriginal-1-pl.html",
             "https://www.camara.leg.br/legislacao/busca?geral=7210&ano=1984&situacao=&abrangencia=&tipodocumento=Lei+Ordin%C3%A1ria&origem=&numero=7210"]
          for u in U:
              t=time.time()
              try:
                  r=requests.get(u,timeout=60,headers=H); r.encoding=r.apparent_encoding; tx=r.text
                  print("DIAG",r.status_code,round(time.time()-t,1),"s",len(tx),"chars",len(re.findall(r"Art\.\s*\d",tx)),"art",r.headers.get("content-type","")[:30],u)
                  print("DIAG AMOSTRA",re.sub(r"\s+"," ",tx)[:260])
                  for m in re.findall(r'legin/fed/lei/1984/lei-7210[^"\' ]+',tx)[:5]: print("DIAG LINK",m)
              except Exception as e: print("DIAG ERRO",type(e).__name__,str(e)[:100],u)
          PY
