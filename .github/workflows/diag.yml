name: diag
on:
  push:
    branches: [main]
    paths: ['banco/diag.txt']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: nproc; free -g
      - run: |
          python3 - <<'PY'
          import requests,time,re
          import json
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) Chrome/124","Accept":"application/json"}
          r=requests.get("https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1984-07-11;7210&tipo_documento=maior-detalhe",headers=H,timeout=60)
          d=r.json()
          for e in d.get("encoding",[]): print("DIAG ENC",json.dumps(e,ensure_ascii=False)[:600])
          for e in d.get("encoding",[]):
              u=e.get("contentUrl") or e.get("url")
              print("DIAG JSONENC",json.dumps(e,ensure_ascii=False)[600:1400])
              if not u: continue
              u=u.replace("/api/binario/","/api/public/binario/")
              try:
                  t=time.time(); x=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=90); x.encoding=x.apparent_encoding
                  tx=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",x.text))
                  print("DIAG BAIXOU",x.status_code,round(time.time()-t,1),"s",x.headers.get("content-type","")[:40],len(x.text),"chars",len(re.findall(r"Art\.\s*\d",tx)),"art",u[:150])
                  m=re.search(r"Art\.\s*112",tx); print("DIAG ART112",tx[m.start():m.start()+400] if m else "-")
              except Exception as ex: print("DIAG ERRO",str(ex)[:100],u[:120])
          PY
