name: coleta2-bases
on: workflow_dispatch
permissions: { contents: write }
jobs:
  coleta2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas pyarrow
      - run: python banco/externas/coleta2.py
      - run: |
          git config user.name "HD Concursos"; git config user.email "hilquiasdan@users.noreply.github.com"
          git add banco/externas/candidatas2.json && git commit -m "Questões candidatas (OAB 2017-2025 e ENEM)" && git push || echo "nada novo"
