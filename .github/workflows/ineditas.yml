name: ineditas
on:
  push:
    branches: [main]
    paths: ['banco/gera_pedido.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      nome: ${{ steps.s.outputs.nome }}
      entrada: ${{ steps.s.outputs.entrada }}
      partes: ${{ steps.s.outputs.partes }}
      matriz: ${{ steps.s.outputs.matriz }}
      alvo: ${{ steps.s.outputs.alvo }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          n=$(sed -n 's/^partes: *//p' banco/gera_pedido.txt); n=${n:-1}
          echo "nome=$(sed -n 's/^nome: *//p' banco/gera_pedido.txt)" >> $GITHUB_OUTPUT
          echo "entrada=$(sed -n 's/^entrada: *//p' banco/gera_pedido.txt)" >> $GITHUB_OUTPUT
          echo "partes=$n" >> $GITHUB_OUTPUT
          a=$(sed -n 's/^alvo: *//p' banco/gera_pedido.txt); echo "alvo=${a:-3}" >> $GITHUB_OUTPUT
          echo "matriz=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> $GITHUB_OUTPUT
  gera:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJson(needs.prep.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen25-14b
      - run: pip install requests
      - run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 8
          ollama pull qwen2.5:14b
      - run: |
          cd banco && mkdir -p ineditas
          ALVO=${{ needs.prep.outputs.alvo }} LIMITE_SEG=19500 python gerador.py ineditas/parte_${{ matrix.parte }}.json ${{ matrix.parte }} ${{ needs.prep.outputs.partes }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ined-${{ matrix.parte }}
          path: banco/ineditas/parte_${{ matrix.parte }}.json
  junta:
    needs: [prep, gera]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: |
          mkdir -p banco/ineditas
          python3 -c "
          import json,glob
          v=[]
          for f in glob.glob('art/*/*.json'): v+=json.load(open(f))
          json.dump(v,open('banco/ineditas/saida_${{ needs.prep.outputs.nome }}.json','w'),ensure_ascii=False)
          print('aprovadas',len(v),'dificeis',sum(1 for x in v if x.get('dificil')))"
          git config user.name "HD Concursos"; git config user.email "hilquiasdan@users.noreply.github.com"
          git add banco/ineditas/saida_${{ needs.prep.outputs.nome }}.json
          git commit -m "ineditas: ${{ needs.prep.outputs.nome }}" || echo nada
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
