name: coleta3-bases
on: workflow_dispatch
permissions: { contents: write }
jobs:
  coleta3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas pyarrow
      - run: python banco/externas/coleta3.py
      - run: |
          git config user.name "HD Concursos"; git config user.email "hilquiasdan@users.noreply.github.com"
          git add banco/externas/candidatas3.json && git commit -m "Questões candidatas (ENEM 2009-2017)" && git push || echo "nada novo"
