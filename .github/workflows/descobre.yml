name: descobre-bases
on: workflow_dispatch
permissions: { contents: write }
jobs:
  descobre:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python banco/externas/descobre.py
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: |
          git config user.name "HD Concursos"; git config user.email "hilquiasdan@users.noreply.github.com"
          git add banco/externas/descoberta.json && git commit -m "Descoberta de bases abertas de questões" && git push || echo "nada novo"
