name: questoes-externas
on: workflow_dispatch
permissions: { contents: write }
jobs:
  oab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas pyarrow
      - run: python banco/externas/oab.py
      - run: |
          git config user.name "HD Concursos"; git config user.email "hilquiasdan@users.noreply.github.com"
          git add banco/externas/oab_filtradas.json && git commit -m "Questões externas (OAB) filtradas para revisão" && git push || echo "nada novo"
