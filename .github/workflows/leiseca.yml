name: leiseca
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: cd banco && mkdir -p ineditas && python lei_seca_itens.py ineditas/lei_seca.json && python questoes_lei.py ineditas/questoes_lei.json
      - run: |
          git config user.name "HD Concursos"; git config user.email "hilquiasdan@users.noreply.github.com"
          git add banco/ineditas/lei_seca.json banco/ineditas/questoes_lei.json; git commit -m "lei seca: itens gerados" || echo nada
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
