# Fontes de provas (PDF oficial das bancas). Para incluir uma banca nova, copie um bloco e ajuste.
# tipo: api_cebraspe | rastreio (segue links do site atrás de PDFs de prova e gabarito)
cebraspe:
  tipo: api_cebraspe
  banca: Cebraspe
fgv:
  tipo: rastreio
  banca: FGV
  inicio: [https://conhecimento.fgv.br/concursos]
  dominio: 'conhecimento\.fgv\.br'
  seguir: 'concursos\?|page=|encerrad|anteriores|/concursos/[a-z0-9-]+$|/concursos/[a-z0-9-]+/'
  max_paginas: 3000
